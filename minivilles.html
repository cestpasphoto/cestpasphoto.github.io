<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machi Koro with AI</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>

  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

  <script src="./minivilles/constants.js"></script>
  <script src="./common/game.js"></script>
  <script src="./minivilles/minivilles.js"></script>

  <style>
    body { background: #f7f5ef; }
    body, .mk * { font-family: Lato, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 6px 1.5em; }
    .small { font-size: 0.85em; color: #777; }
    .sq { display: inline-block; width: 0.75em; height: 0.75em; border-radius: 2px; vertical-align: -0.05em; }

    /* top bar: title and settings */
    .bar { display: flex; align-items: center; gap: 6px; padding: 6px; background: #fff; border-bottom: 1px solid #e3e0d6; }
    .bar h1 { font-size: 1.15em; margin: 0 auto 0 2px; white-space: nowrap; }
    .bar h1 .ai { font-weight: normal; color: #999; font-size: 0.8em; }
    .bar select { font-size: 0.9em; padding: 3px 4px; border: 1px solid #ddd; border-radius: 4px; background: #fff; max-width: 7.5em; }
    .bar .ui.icon.button { margin: 0; padding: 0.5em 0.6em; }

    /* prompt: dice, status, selected row, choices */
    .prompt { background: #fff; border: 1px solid #e3e0d6; border-radius: 6px; padding: 5px 7px; margin-top: 5px; }
    .prompt.over { background: #f0faf2; border-color: #a6dbb2; }
    .prompt .row1 { display: flex; align-items: center; gap: 6px; min-height: 1.7em; font-size: 1.2em; line-height: 1.25; }
    .prompt .dice { display: inline-flex; align-items: center; gap: 3px; }
    .prompt .dice .sum { margin-left: 3px; font-size: 1.1em; }
    .die { width: 1.55em; height: 1.55em; }
    .prompt .sel { margin-top: 3px; font-size: 0.92em; line-height: 1.3; }
    .prompt .why { color: #b03a2e; white-space: nowrap; }
    .choices { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .choices .ui.button { margin: 0; }
    .choices .undo { margin-left: auto !important; }

    /* the ledger: one row per card or landmark, one column per player */
    table.ledger { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; margin-top: 5px;
                   background: #fff; border: 1px solid #e3e0d6; border-radius: 6px; overflow: hidden; user-select: none; }
    .ledger th, .ledger td { padding: 0 3px; border-bottom: 1px solid #f1eee6; }
    .ledger tr:last-child td { border-bottom: none; }
    .ledger th { font-size: 0.8em; text-align: center; background: #faf8f2; line-height: 1.15; padding: 3px 1px; white-space: nowrap; overflow: hidden; }
    .ledger th.n { width: 2.1rem; } .ledger th.left { width: 1.6rem; } .ledger th.p { width: 2.75rem; } .ledger th.cost { width: 2.7rem; }
    .ledger th.left { font-size: 0.68em; color: #aaa; font-weight: normal; }
    .ledger th.p { font-size: 0.74em; letter-spacing: -0.02em; }
    .ledger th.turn { box-shadow: inset 0 -3px 0 currentColor; }
    .ledger td { height: 2.05em; }
    .ledger td.n { text-align: center; color: #fff; font-weight: 900; font-size: 0.78em; white-space: nowrap; padding: 0; }
    .ledger td.fx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9em; color: #333; padding-left: 5px; }
    .ledger td.fx .e { font-size: 1.15em; margin-right: 3px; }
    .ledger td.k { text-align: center; font-size: 0.95em; }
    .ledger td.k.z { color: #d4d4d4; }
    .ledger td.k.me { background: #eef5fc; font-weight: bold; color: #2185D0; }
    .ledger td.cost { text-align: right; white-space: nowrap; padding-right: 5px; }
    .ledger td.cost b { color: #8a5a00; font-size: 0.92em; }
    .ledger td.left { text-align: center; font-size: 0.78em; color: #999; padding: 0; }
    .ledger tr.buy { cursor: pointer; }
    .ledger tr.dim td.fx, .ledger tr.dim td.cost { opacity: 0.45; }
    .ledger tr.lm td:not(.n) { background: #fffcf0; }
    .ledger tr.sel td:not(.n) { background: #e7f7ea !important; }
    .ledger tr.sel td.fx { box-shadow: inset 3px 0 0 #21ba45; }

    /* income by roll */
    .inc { display: grid; grid-template-columns: 5.6em repeat(12, 1fr); gap: 1px; font-size: 0.74em; text-align: center; line-height: 1.5;
           background: #fff; border-left: 4px solid; border-radius: 0 4px 4px 0; padding: 3px 5px; margin-top: 5px; }
    .inc .h { color: #aaa; }
    .inc .lab { text-align: left; color: #555; white-space: nowrap; overflow: hidden; }
    .inc .v { background: #f2f0ea; border-radius: 2px; white-space: nowrap; }
    .inc .v.pos { background: #d8f0dc; color: #1d6b2c; font-weight: bold; }
    .inc .v.neg { background: #f8dcd8; color: #a3352a; }
    .inc .v.cur { outline: 1.5px solid #333; }
    .inc .v.na { background: none; }

    /* folding panels below the fold */
    .panel { margin-top: 6px; background: #fff; border: 1px solid #e3e0d6; border-radius: 6px; padding: 5px 8px; }
    .panel .head { cursor: pointer; }
    .panel .evt { padding: 0.15em 0; border-bottom: 1px solid #f0f0f0; font-size: 0.92em; }
    .panel .evt.turn { color: #999; }
    .legend div { margin: 0.15em 0; }
  </style>
</head>
<body><div class="mk" x-data x-init="$store.game.start()">

<!-- Title and settings -->
<div class="bar">
  <button class="ui basic icon button" title="New game" @click="ui_newGame()"><i class="file outline icon"></i></button>
  <h1>Machi Koro <span class="ai">with AI</span></h1>
  <select x-model.number="$store.game.numMCTSSims" @change="$store.game.changeDifficulty()" title="AI level">
    <optgroup label="Above optimal">
    <option value="1600">Boosted</option>
    </optgroup>
    <optgroup label="Level used during training">
    <option value="400">Native</option>
    </optgroup>
    <optgroup label="Sub optimal levels">
    <option value="100">Medium</option>
    <option value="25" selected>Easy</option>
    <option value="12">Easier</option>
    <option value="3">Come on</option>
    </optgroup>
  </select>
  <select @change="$store.game.setGameMode($event.target.value)" title="Who plays">
    <option value="P0" selected>You vs AI</option>
    <option value="P1">AI vs you</option>
    <option value="Human">No AI</option>
    <option value="AI">WarGames</option>
  </select>
</div>

<div class="wrap">

  <!-- Dice, status, selected row and choices -->
  <div class="prompt" :class="{ over: $store.game.gameEnded }">
    <div class="row1">
      <span class="dice" x-html="ui_diceHtml()"></span>
      <i class="notched circle loading icon" x-show="$store.game.isThinking || $store.game.isLoading"></i>
      <span x-html="ui_promptHtml()"></span>
    </div>
    <div class="sel" x-show="ui_canAct() && $store.game.extra.sel >= 0" x-html="ui_selHtml()"></div>
    <div class="small" x-show="ui_canAct() && !($store.game.extra.sel >= 0) && !$store.game.view.awaiting && $store.game.extra.prompt" x-text="$store.game.extra.prompt"></div>
    <div class="choices">
      <template x-for="(c, i) in (ui_canAct() ? ($store.game.extra.choices || []) : [])" :key="'c' + i + c.l">
        <button class="ui compact button" :class="c.c" @click="$store.game.act(c.a, ...c.x)" x-html="c.l"></button>
      </template>
      <button class="ui compact basic icon button undo" title="Undo" @click="ui_undo()"
              :class="{ disabled: !$store.game.canUndo || $store.game.isThinking || $store.game.isLoading }">
        <i class="undo icon"></i>
      </button>
    </div>
  </div>

  <!-- Ledger: market and every city -->
  <table class="ledger" x-show="$store.game.view.players">
    <thead>
      <tr>
        <th class="n"></th>
        <th class="left">left</th>
        <th style="text-align:left; padding-left:5px">Card</th>
        <template x-for="p in ui_cols()" :key="'h' + p">
          <th class="p" :class="{ turn: p === $store.game.currentPlayer && !$store.game.gameEnded }"
              :style="'color:' + SEAT_COLORS[p]" x-html="ui_colHead(p)"></th>
        </template>
        <th class="cost">Cost</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="i in ROWS" :key="'r' + i">
        <tr :class="{ lm: !ui_isCard(i), sel: $store.game.extra.sel === i, buy: ui_canAct(), dim: ui_rowDim(i) }"
            @click="ui_clickRow(i)" :title="ui_rowInfo(i).name">
          <td class="n" :style="'background:' + ui_rowBand(i)" x-text="ui_rowNum(i)"></td>
          <td class="left" x-text="ui_isCard(i) ? '×' + ui_rowLeft(i) : ''"></td>
          <td class="fx"><span class="e" x-text="ui_rowInfo(i).e"></span><span x-text="ui_rowInfo(i).fx"></span></td>
          <template x-for="p in ui_cols()" :key="'k' + i + '-' + p">
            <td class="k" :class="{ z: !ui_owned(i, p), me: p === ui_viewer() && ui_owned(i, p) }" x-text="ui_cellText(i, p)"></td>
          </template>
          <td class="cost"><b x-text="ui_rowCost(i) + '🪙'"></b></td>
        </tr>
      </template>
    </tbody>
  </table>

  <!-- Income by roll -->
  <div class="inc" x-show="$store.game.view.players" :style="'border-left-color:' + SEAT_COLORS[ui_focus()]">
    <span></span>
    <template x-for="d in 12" :key="'h' + d"><span class="h" x-text="d"></span></template>
    <span class="lab" x-text="ui_incLabel('own')"></span>
    <template x-for="d in 12" :key="'o' + d"><span class="v" :class="ui_incCell('own', d).cls" x-text="ui_incCell('own', d).txt"></span></template>
    <span class="lab" x-text="ui_incLabel('others')"></span>
    <template x-for="d in 12" :key="'t' + d"><span class="v" :class="ui_incCell('others', d).cls" :title="ui_incCell('others', d).tip" x-text="ui_incCell('others', d).txt"></span></template>
  </div>

  <!-- Journal: what happened since your last turn -->
  <div class="panel" x-data="{ open: true }" x-show="$store.game.view.players">
    <div class="head" @click="open = !open"><span class="small" x-text="open ? '▾' : '▸'"></span> <b>Journal</b></div>
    <div x-show="open" style="margin-top: 0.3em">
      <template x-for="ev in ui_recent()" :key="'ev' + ev.id">
        <div class="evt" :class="{ turn: ev.k === 'turn' }" x-html="ui_fmt(ev.t)"></div>
      </template>
    </div>
  </div>

  <!-- Card colours and rules reminder -->
  <div class="panel legend" x-data="{ open: true }">
    <div class="head" @click="open = !open"><span class="small" x-text="open ? '▾' : '▸'"></span> <b>Card colors</b></div>
    <div x-show="open" class="small" style="margin-top: 0.3em">
      <template x-for="[c, txt] in COLOR_RULES" :key="c">
        <div><span class="sq" :style="'background:' + CARD_COLORS[c]"></span> pays on <span x-text="txt"></span></div>
      </template>
      <div><span class="sq" style="background:#d4a400"></span> landmark: build all four to win. Tap any row for details.</div>
    </div>
  </div>

  <!-- State ID: same wire format as pit.py's --state / -s (Arena.playGame) -->
  <div class="panel" x-data="{ open: false, copied: false }" x-show="$store.game.view.players">
    <div class="head" @click="open = !open"><span class="small" x-text="open ? '▾' : '▸'"></span> <b>State ID</b></div>
    <div x-show="open" style="margin-top: 0.3em">
      <div class="small" style="margin-bottom: 0.3em">For <code>pit.py --state</code> / <code>-s</code>.</div>
      <textarea readonly rows="3"
                style="width: 100%; font-family: monospace; font-size: 0.72em; word-break: break-all; resize: none; border: 1px solid #ddd; padding: 0.3em; box-sizing: border-box"
                x-text="$store.game.view.stateId" @click="$el.select()"></textarea>
      <button class="ui compact button" style="margin-top: 0.3em"
              @click="navigator.clipboard.writeText($store.game.view.stateId || '').then(() => { copied = true; setTimeout(() => copied = false, 1200) })"
              x-text="copied ? 'Copied ✓' : 'Copy'"></button>
    </div>
  </div>

</div>
</div></body>
</html>
