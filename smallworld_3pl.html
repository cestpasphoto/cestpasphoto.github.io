<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/ort.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

  <script src="./smallworld/constants_3pl.js"></script>
  <script src="./common/game.js"></script>
  <script src="./smallworld/smallworld.js"></script>

  <style>
    /* Styles pour rendre la carte SVG interactive et propre */
    .map-svg { width: 100%; height: auto; user-select: none; }
    .area-poly { transition: fill-opacity 0.2s, stroke-width 0.2s; cursor: pointer; }
    .area-poly:hover { fill-opacity: 0.7; }
    .area-poly.disabled { cursor: default; }
    
    .token-text { font-family: sans-serif; font-weight: bold; font-size: 3px; alignment-baseline: central; text-anchor: middle; }
    .icon-text { font-family: 'Icons'; font-size: 3.5px; alignment-baseline: central; text-anchor: middle; }
  </style>
</head>
<body><div x-data x-init="$store.game.start()">

<div class="ui borderless menu">
  <div class="ui container">    
    <div class="fitted item">
      <button class="ui icon button" @click="$store.game.reset()"><i class="file outline icon"></i></button>
    </div> 
    <div class="fitted item" style="display: none;"> 
      </div>
    <div class="fitted item"> 
      <div class="ui small form">
        <div class="field">
          <select x-model.number="$store.game.numMCTSSims" @change="$store.game.changeDifficulty()" class="ui dropdown">
            <optgroup label="Above optimal">
            <option value="12800">God-like</option>
            <option value="3200">Boosted</option>
            </optgroup>
            <optgroup label="Level used during training">
            <option value="800">Native</option>
            </optgroup>
            <optgroup label="Sub optimal levels">
            <option value="200" selected>Medium</option>
            <option value="50">Easy</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
    <div class="fitted item"> 
      <div class="ui small form">
        <div class="field">
          <select class="ui dropdown" @change="$store.game.setGameMode($event.target.value)">
              <option value="P0" selected>You vs AI</option>
              <option value="P1">AI vs you</option>
              <option value="Human">No AI</option>
              <option value="AI">WarGames</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="ui main container">
  <h1 class="ui huge center aligned header">Smallworld with AI</h1> 
  <div class="ui hidden divider"></div>

  <button x-show="$store.game.isLoading || $store.game.isThinking" class="ui fluid large active loading button">Loading...</button>

  <template x-if="!$store.game.isLoading && $store.game.view && $store.game.view.board">
    <div>
      
      <div class="ui horizontal segments">
        <template x-for="(player, pIdx) in $store.game.view.players" :key="'player-'+pIdx">
          <div class="ui center aligned segment" :class="{'secondary': $store.game.currentPlayer !== pIdx}">
            <h3 class="ui header" :class="ui_playerColorClass(pIdx)" x-text="'Player ' + pIdx + ' - ' + player.score + ' pts'"></h3>
            
            <template x-for="(ppl, pplIdx) in player.peoples" :key="'p'+pIdx+'-ppl'+pplIdx">
              <div x-show="ppl[1] !== 0" style="margin-top: 5px;">
                <span class="ui label" :class="{'basic': ppl[1] < 0, [ui_playerColorClass(pIdx)]: true}">
                  <span x-text="ui_raceName(ppl[1]) + ' ' + ui_powerName(ppl[2])"></span>
                  <div class="detail" x-text="ppl[5] + ' \uf0c0'"></div> </span>
              </div>
            </template>
          </div>
        </template>
      </div>

      <div class="ui hidden divider"></div>

      <div style="position: relative; width: 100%; aspect-ratio: 140/100;">
        
        <template x-for="(area, aIdx) in $store.game.view.board" :key="'area-'+aIdx">
          <svg viewBox="0 0 140 100" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
            
            <g style="pointer-events: auto; cursor: pointer;" 
               @click="ui_isAreaClickable(aIdx) ? $store.game.act('click_area', aIdx) : null">
              
              <polygon :points="ui_polyStr(aIdx)" 
                       :fill="ui_areaColor(area)"
                       :stroke="ui_areaStroke(aIdx)"
                       :stroke-width="ui_areaStrokeWidth(aIdx)"
                       :stroke-dasharray="ui_areaDasharray(aIdx)"></polygon>
              
              <text x-show="ui_territoryPos(aIdx).x > 0"
                    :x="ui_territoryPos(aIdx).x" :y="ui_territoryPos(aIdx).y"
                    text-anchor="middle" dominant-baseline="central" font-size="3" font-weight="bolder" fill="black"
                    x-html="ui_terrainSymbols(area)"></text>

              <g x-show="ui_defensePos(aIdx).x > 0 && (area[2] > 0 || area[3] == 4)">
                 <g :transform="'translate(' + (ui_defensePos(aIdx).x - 3) + ',' + (ui_defensePos(aIdx).y - 3) + ')'"
                    x-html="ui_defenseSvg(area)"></g>
              </g>

              <g x-show="area[0] > 0" :transform="'translate(' + (ui_tokenPos(aIdx).x - 3) + ',' + (ui_tokenPos(aIdx).y - 3) + ')'">
                  <rect width="6" height="6" x="0" y="0" :fill="ui_tokenStyle(area[1]).bg" />
                  
                  <text x="3" y="3" text-anchor="middle" dominant-baseline="central" font-size="5" font-weight="bolder" 
                        :fill="ui_tokenStyle(area[1]).txt" x-text="ui_tokenStyle(area[1]).char"></text>
                  
                  <text x="0.5" y="2" font-size="1.5" font-weight="bolder" 
                        :fill="ui_tokenStyle(area[1]).txt" x-text="area[0]"></text>
                        
                  <circle x-show="ui_hasPreviousMove(aIdx)" cx="3" cy="6" r="1" :fill="ui_previousMoveColor(aIdx)" stroke="white" stroke-width="0.2"/>
              </g>

            </g>
          </svg>
        </template>
      </div>

      <div class="ui hidden divider"></div>

      <div class="ui center aligned grid">
        <div class="sixteen wide column">
          <div class="ui mini labels" id="roundP" x-html="ui_roundDisplay()"></div>
        </div>

        <div class="sixteen wide column">
          <button class="ui button" :class="ui_btnClass(10, 'green')" x-show="$store.game.extra.allowedBtns[10]" @click="$store.game.act('click_btn', 10)">Start Game</button>
          
          <button class="ui button" :class="ui_btnClass(0, 'green')" x-show="$store.game.extra.allowedBtns[0]" @click="$store.game.act('click_btn', 0)">Attack</button>
          <button class="ui button" :class="ui_btnClass(1, 'blue')" x-show="$store.game.extra.allowedBtns[1]" @click="$store.game.act('click_btn', 1)">Use Ppl</button>
          <button class="ui button" :class="ui_btnClass(2, 'blue')" x-show="$store.game.extra.allowedBtns[2]" @click="$store.game.act('click_btn', 2)" x-text="$store.game.extra.selectingDiplomacy ? 'Diplomacy' : 'Use Power'"></button>
          <button class="ui button" :class="ui_btnClass(8, 'red')" x-show="$store.game.extra.allowedBtns[8]" @click="$store.game.act('click_btn', 8)">Abandon</button>
          
          <button class="ui button" :class="ui_btnClass(3, 'pink')" x-show="$store.game.extra.allowedBtns[3]" @click="$store.game.act('click_btn', 3)">Deploy all</button>
          <button class="ui button" :class="ui_btnClass(4, 'pink')" x-show="$store.game.extra.allowedBtns[4]" @click="$store.game.act('click_btn', 4)">Deploy 1</button>
          <button class="ui button" :class="ui_btnClass(7, 'blue')" x-show="$store.game.extra.allowedBtns[7]" @click="$store.game.act('click_btn', 7)">Skip Deploy</button>
          
          <button class="ui button" :class="ui_btnClass(5, 'blue')" x-show="$store.game.extra.allowedBtns[5]" @click="$store.game.act('click_btn', 5)">Pick Combo</button>
          <button class="ui button" :class="ui_btnClass(9, 'grey')" x-show="$store.game.extra.allowedBtns[9]" @click="$store.game.act('click_btn', 9)">Go in Decline</button>
          <button class="ui button" :class="ui_btnClass(6, 'blue')" x-show="$store.game.extra.allowedBtns[6]" @click="$store.game.act('click_btn', 6)">End Turn</button>
          
          <button class="ui icon button" @click="$store.game.undo()" :disabled="!$store.game.canUndo"><i class="undo icon"></i></button>
          <button class="ui primary button" x-show="$store.game.extra.confirmNeeded" @click="$store.game.act('confirm')">Confirm ?</button>
        </div>
      </div>

      <div class="ui hidden divider"></div>

      <div class="ui segment" x-show="$store.game.extra.allowedBtns[5] || $store.game.extra.selectedBtn === 5">
        <h4 class="ui header">Available Combinations</h4>
        <div class="ui stackable center aligned middle aligned grid">
          <template x-for="(deckItem, dIdx) in $store.game.view.deck" :key="'deck-'+dIdx">
            <div class="row" style="padding: 5px 0;">
              <div class="three wide column">
                <button class="ui fluid compact button" 
                        :class="ui_deckBtnClass(dIdx)" 
                        @click="$store.game.extra.allowedBtns[5] ? $store.game.act('click_deck', dIdx) : null"
                        x-html="dIdx + ' <i class=\'coins icon\'></i>'">
                </button>
              </div>
              <div class="thirteen wide left aligned column" x-html="ui_deckDescr(deckItem)"></div>
            </div>
          </template>
        </div>
      </div>

    </div>
  </template>

</div>

</body>
</html>
