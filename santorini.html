<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santorini AI</title>
  
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
  
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/ort.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  
  <script src="./santorini/constants_nogod.js"></script>
  <script src="./common/game.js"></script> <script src="./santorini/main.js"></script> <style>
    /* Custom Grid Layout for the Board */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 20px;
      max-width: 500px; /* Limit board size */
      margin-left: auto;
      margin-right: auto;
    }

    .board-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: default;
      transition: background-color 0.2s;
      white-space: pre-wrap; /* Allow newlines in text (P0 \n 2) */
    }

    .board-cell.clickable {
      cursor: pointer;
    }
    
    /* Semantic UI Color Mappings override or utility */
    .bg-white { background-color: #ffffff; }
    .bg-blue { background-color: #2185d0; color: white; }
    .bg-teal { background-color: #00b5ad; color: white; }
    .bg-green { background-color: #21ba45; color: white; }
    .bg-red { background-color: #db2828; color: white; }
    .bg-yellow { background-color: #fbbd08; color: white; }
    .bg-orange { background-color: #f2711c; color: white; }
  </style>
</head>

<body class="ui container" style="padding-top: 20px;">

  <div x-data x-init="$store.game.start()">
  
    <div class="ui borderless menu">
      <div class="item">
        <div class="ui header">Santorini</div>
      </div>

      <div class="item">
        <div class="ui form">
          <div class="inline fields" style="margin-bottom: 0;">
            <div class="field">
              <label>P0:</label>
              <select x-model.boolean="$store.game.arePlayersHuman[0]" @change="$store.game.trigger_ai_check()" :disabled="$store.game.isThinking" class="ui compact">
                <option :value="true" :selected="$store.game.arePlayersHuman[0] === true">Human</option>
                <option :value="false" :selected="$store.game.arePlayersHuman[0] === false">IA</option>
              </select>
            </div>
            <div class="field" style="margin-left: 10px;">
              <label>P1:</label>
              <select x-model.boolean="$store.game.arePlayersHuman[1]" @change="$store.game.trigger_ai_check()" :disabled="$store.game.isThinking" class="ui compact">
                <option :value="true" :selected="$store.game.arePlayersHuman[1] === true">Human</option>
                <option :value="false" :selected="$store.game.arePlayersHuman[1] === false">IA</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      
      <div class="right menu">
        <div class="item">
          <button class="ui icon button" 
                  :class="{'yellow': $store.game.editMode === 1, 'orange': $store.game.editMode === 2}" 
                  @click="$store.game.toggleEdit()"
                  :disabled="$store.game.isLoading || $store.game.isThinking">
            <i class="edit icon"></i>
            <span x-show="$store.game.editMode === 1">Levels</span>
            <span x-show="$store.game.editMode === 2">Workers</span>
          </button>
        </div>

        <div class="item">
          <button class="ui icon button" 
                  @click="$store.game.undo()" 
                  :disabled="!$store.game.canUndo || $store.game.isLoading || $store.game.isThinking">
            <i class="undo icon"></i>
          </button>
        </div>

        <div class="item">
          <button class="ui icon button" 
                  @click="$store.game.reset()" 
                  :disabled="$store.game.isLoading || $store.game.isThinking">
            <i class="sync icon"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="ui center aligned basic segment">
      <div x-show="$store.game.isLoading" class="ui icon message">
        <i class="notched circle loading icon"></i>
        <div class="content">
          <div class="header">Just one second</div>
          <p x-text="$store.game.loadingMessage"></p>
        </div>
      </div>

      <div x-show="!$store.game.isLoading">
        <h2 class="ui header" 
            :class="{'green': $store.game.gameEnded, 'blue': !$store.game.gameEnded}" 
            x-text="$store.game.statusMessage">
        </h2>
      </div>
    </div>

    <div class="board-grid" x-show="!$store.game.isLoading">
      <template x-for="cell in $store.game.view.cells" :key="cell.y + '-' + cell.x">
        <div class="board-cell"
             :class="[
                'bg-' + cell.colorClass, 
                cell.isSelectable ? 'clickable' : ''
             ]"
             @click="cell.isSelectable ? $store.game.clickCell(cell.y, cell.x) : null">
           <div x-show="cell.lastWorker || cell.lastBuild" class="ui tiny red corner empty circular label"></div>        
           <span x-text="cell.text"></span>
        </div>
      </template>
    </div>

    <div class="ui center aligned basic segment text-muted" style="margin-top: 20px; color: grey;">
      <p x-show="$store.game.editMode === 0">Select a worker to move, then select a destination, then build.</p>
      <p x-show="$store.game.editMode !== 0">Edit Mode Active: Tap cells to modify board state.</p>
    </div>

  </div>

</body>
</html>
