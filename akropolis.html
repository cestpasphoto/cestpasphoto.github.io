<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/ort.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  
  <script src="./common/game.js"></script>
  <script src="./akropolis/constants.js"></script>
  <script src="./akropolis/akropolis.js"></script>
  
  <style>
    @media only screen and (min-width: 992px) {
      [class*="mobile only"]:not(.computer), [class*="tablet only"]:not(.computer), [class*="computer hidden"] { display: none !important; }
      [class*="svgS"] { width: 3.5rem; max-width: 100%; }
      [class*="svgM"] { width: 6.0rem; max-width: 100%; }
      [class*="svgL"] { width: 9.0rem; max-width: 100%; }
    }
    @media only screen and (min-width: 768px) and (max-width: 991px) {
      [class*="mobile only"]:not(.tablet), [class*="tablet hidden"], [class*="computer only"]:not(.tablet) { display: none !important; }
      [class*="svgS"] { width: 2.6rem; max-width: 100%; }
      [class*="svgM"] { width: 5.0rem; max-width: 100%; }
      [class*="svgL"] { width: 7.0rem; max-width: 100%; }
    }
    @media only screen and (max-width: 767px) {
      [class*="mobile hidden"], [class*="tablet only"]:not(.mobile), [class*="computer only"]:not(.mobile) { display: none !important; }
      [class*="svgS"] { width: 2.2rem; max-width: 100%; }
      [class*="svgM"] { width: 4.0rem; max-width: 100%; }
      [class*="svgL"] { width: 6.0rem; max-width: 100%; }
    }
    
    .score-badge {
      display: inline-block;
      padding: 0.2em 0.3em;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
      margin: 0 2px;
      font-size: 0.9em;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .city-container {
      width: 100%;
      background-color: #f8fafc;
      overflow: hidden;
      touch-action: none; /* Crucial for custom mobile dragging */
    }
    .city-svg {
      width: 100%;
      height: 100%;
    }
    
    /* MOBILE & TABLETTE */
    @media only screen and (max-width: 991px) {
      .desktop-city-header { display: none; }
      .city-wrapper { display: none; }
      .city-wrapper.active-tab { display: block; }
      .city-container {
        height: 65vh;
        border-radius: 0 0 8px 8px;
        border: 1px solid #d4d4d5;
        border-top: none;
      }
    }

    /* ORDINATEUR / DESKTOP (Grille) */
    @media only screen and (min-width: 992px) {
      .player-tabs-menu { display: none !important; }
      .cities-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .city-wrapper { display: block !important; }
      .city-container {
        height: 55vh; 
        border-radius: 8px;
        border: 1px solid #d4d4d5;
      }
      .desktop-city-header {
        display: block;
        text-align: center;
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 5px;
        color: #333;
      }
    }
  </style>
</head>

<body>
<div x-data="{ activeTab: 0 }" 
     x-init="$store.game.start(); $watch('$store.game.currentPlayer', val => activeTab = val)">

  <div class="ui borderless menu">
    <div class="ui container">    
      <div class="fitted item">
        <button class="ui icon button" @click="$store.game.reset()"><i class="file outline icon"></i></button>  
      </div> 
      <div class="fitted item"> 
        <div class="ui small form">
          <div class="field">
            <select x-model.number="$store.game.numMCTSSims" @change="$store.game.changeDifficulty()" class="ui dropdown">
              <option value="6400">God level</option>
              <optgroup label="Sub optimal levels">
              <option value="100">Medium</option>
              <option value="25" selected>Easy</option>
              </optgroup>
            </select>
          </div>
        </div>
      </div>
      <div class="fitted item"> 
        <div class="ui small form">
          <div class="field">
            <select class="ui dropdown" @change="$store.game.setGameMode($event.target.value)">
                <option value="P0" selected>You vs AI</option>
                <option value="P1">AI vs you</option>
                <option value="Human">No AI</option>
                <option value="AI">WarGames</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="ui main text container" style="padding-top: 10px;">

    <h2 class="ui center aligned header" style="margin-bottom: 5px;">Akropolis</h2> 

    <button x-show="$store.game.isLoading || $store.game.isThinking" class="ui fluid large active loading button" style="margin-top: 10px;">‌</button>

    <template x-if="!$store.game.isLoading && $store.game.view && $store.game.view.construction_site">
      <div>
        
        <div class="ui very compact equal width center aligned grid" style="margin-top: 10px;">
          <template x-for="(tile, idx) in $store.game.view.construction_site" :key="'market-'+idx">
            <div class="column" style="padding: 5px;">
              <a href="#" @click.prevent="$store.game.act('select_tile', idx)">
                  <div x-html="ui_renderTile3D(tile, $store.game.extra.selected_tile === idx, 'svgM')"></div>
              </a>
              <div class="ui tiny label" :class="idx <= $store.game.view.players[$store.game.currentPlayer].stones ? 'green' : ''" style="margin-top: 2px;">
                <span x-text="idx"></span> <i class="gem outline icon" style="margin:0;"></i>
              </div>
            </div>
          </template>

          <div class="column middle aligned" style="padding: 5px;">
              <div class="ui tiny statistic">
                  <div class="value" x-text="$store.game.view.stacks_remaining"></div>
                  <div class="label">Stacks</div>
              </div>
          </div>
        </div>

        <div class="ui fluid large compact buttons" x-show="!$store.game.isLoading" style="margin: 10px 0;">
          <button class="ui basic icon button" @click="$store.game.act('undo', $store.game.arePlayersHuman)" :class="{ 'disabled': !$store.game.canUndo || $store.game.isThinking }">
            <i class="undo icon"></i>
          </button>
          
          <button class="ui button" 
                  :disabled="$store.game.gameEnded || !$store.game.extra.can_confirm || $store.game.isThinking"
                  :class="{ 
                      'basic': !$store.game.gameEnded && !$store.game.extra.can_confirm,
                      'green': ($store.game.gameEnded && $store.game.winners.includes(0)) || (!$store.game.gameEnded && $store.game.extra.can_confirm),
                      'red': $store.game.gameEnded && $store.game.winners.includes(1)
                  }"
                  @click="$store.game.act('confirm_action')"
                  x-text="$store.game.gameEnded ? 'P' + $store.game.winners.join(' & P') + ' wins!' : ($store.game.extra.selected_site >= 0 ? 'Click placement again to rotate, or click here to Confirm' : $store.game.extra.action_message)">
          </button>
        </div>

        <div class="ui segment" style="padding: 10px;">
          <div class="ui relaxed divided list">
            <template x-for="(player, pIdx) in $store.game.view.players" :key="'score-'+pIdx">
              <div class="item" style="padding: 0.3em 0;">
                <div class="content score-row">
                  <strong x-text="(pIdx === 0 ? 'You' : ($store.game.arePlayersHuman[pIdx] ? 'P'+pIdx : 'AI '+pIdx)) + ':'"></strong>
                  <div>
                    <span class="score-badge" style="background-color: #3b82f6;" x-text="player.details[0]"></span> +
                    <span class="score-badge" style="background-color: #facc15; color: black;" x-text="player.details[1]"></span> +
                    <span class="score-badge" style="background-color: #ef4444;" x-text="player.details[2]"></span> +
                    <span class="score-badge" style="background-color: #a855f7;" x-text="player.details[3]"></span> +
                    <span class="score-badge" style="background-color: #22c55e;" x-text="player.details[4]"></span> +
                    <span class="score-badge" style="background-color: #94a3b8;" x-text="player.details[5]"></span>
                    = <strong style="margin-left: 5px; font-size: 1.1em;" x-text="player.points + ' pts'"></strong>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

      </div>
    </template>
  </div>

  <div class="ui fluid container" style="padding: 0 2vw 20px 2vw;">
    <template x-if="!$store.game.isLoading && $store.game.view && $store.game.view.construction_site">
      <div>
        
        <div class="ui top attached tabular menu player-tabs-menu">
          <template x-for="(player, pIdx) in $store.game.view.players" :key="'tab-'+pIdx">
            <a class="item" :class="{ 'active': activeTab === pIdx }" @click.prevent="activeTab = pIdx" 
               x-html="'City P' + pIdx + (pIdx === $store.game.currentPlayer ? ' <i class=\'asterisk icon small red\' style=\'margin-left:5px\'></i>' : '')"></a>
          </template>
        </div>

        <div class="cities-grid">
          <template x-for="(player, pIdx) in $store.game.view.players" :key="'city-'+pIdx">
            <div class="city-wrapper" :class="{ 'active-tab': activeTab === pIdx }">
              <div class="desktop-city-header" x-html="(pIdx === 0 ? 'Your City' : ($store.game.arePlayersHuman[pIdx] ? 'City P'+pIdx : 'City AI '+pIdx)) + (pIdx === $store.game.currentPlayer ? ' <i class=\'asterisk icon small red\'></i>' : '')"></div>
              
              <div class="city-container" 
                   x-data="{ panX: 0, panY: 0, zoom: 1, isDragging: false, startX: 0, startY: 0, hasDragged: false }"
                   @pointerdown="isDragging = true; hasDragged = false; startX = $event.clientX; startY = $event.clientY;"
                   @pointermove="if(isDragging) { 
                      let dx = $event.clientX - startX; let dy = $event.clientY - startY;
                      if(Math.abs(dx) > 3 || Math.abs(dy) > 3) hasDragged = true;
                      panX -= dx * 1.5 / zoom; panY -= dy * 1.5 / zoom; 
                      startX = $event.clientX; startY = $event.clientY; 
                   }"
                   @pointerup="isDragging = false"
                   @pointerleave="isDragging = false"
                   @wheel.prevent="let z = $event.deltaY > 0 ? 0.9 : 1.1; zoom *= z;"
                   :style="isDragging ? 'cursor: grabbing;' : 'cursor: grab;'">
                
                <svg class="city-svg" :viewBox="ui_getCityViewBox(player.city_state, panX, panY, zoom)" style="transition: viewBox 0.1s ease;" preserveAspectRatio="xMidYMid meet">
                    <g x-html="ui_renderCity3D(player.city_state)"></g>
                    <g x-show="pIdx === $store.game.currentPlayer && $store.game.extra.selected_tile >= 0"
                       x-html="ui_renderInteractions3D($store.game.extra.valid_placements, $store.game.extra.ghost_hexes, $store.game.extra.selected_site)"></g>
                </svg>

              </div>
            </div>
          </template>
        </div>

      </div>
    </template>
  </div>

</div>
</body>
</html>
