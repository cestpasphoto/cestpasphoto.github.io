<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/ort.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<script src="./common/game.js"></script>
<script src="./splendor/constants_3pl.js"></script>
<script src="./splendor/splendor.js"></script>
<style>
  /* Computer / Desktop / iPad Landscape */
  @media only screen and (min-width: 992px) {
    [class*="mobile only"]:not(.computer), [class*="tablet only"]:not(.computer), [class*="computer hidden"] {
      display: none !important;
    }
    [class*="svgS"] { width: 3.5rem; max-width: 100%; }
    [class*="svgM"] { width: 4.0rem; max-width: 100%; }
    [class*="svgL"] { width: 7.0rem; max-width: 100%; }
  }

  /* Tablet / iPad Portrait */
  @media only screen and (min-width: 768px) and (max-width: 991px) {
    [class*="mobile only"]:not(.tablet), [class*="tablet hidden"], [class*="computer only"]:not(.tablet) {
      display: none !important;
    }
    [class*="svgS"] { width: 2.6rem; max-width: 100%; }
    [class*="svgM"] { width: 3.5rem; max-width: 100%; }
    [class*="svgL"] { width: 5.0rem; max-width: 100%; }
  }

  /* Mobile */
  @media only screen and                        (max-width: 767px) {
    [class*="mobile hidden"], [class*="tablet only"]:not(.mobile), [class*="computer only"]:not(.mobile) {
      display: none !important;
    }
    [class*="svgS"] { width: 2.2rem; max-width: 100%; }
    [class*="svgM"] { width: 2.8rem; max-width: 100%; }
    [class*="svgL"] { width: 4.5rem; max-width: 100%; }
  }
</style>
<body><div x-data x-init="$store.game.start()">

<div class="ui borderless menu">
  <div class="ui container">    
    <div class="fitted item">
      <button class="ui icon button" @click="$store.game.reset()">
        <i class="file outline icon"></i>
      </button>  
    </div> 
    <div class="fitted item"> 
      <button class="ui icon button" @click="$store.game.toggleEdit()"><i class="edit icon"></i></button>
    </div>
    <div class="fitted item"> 
      <div class="ui small form">
        <div class="field">
          <select 
            x-model.number="$store.game.numMCTSSims" 
            @change="$store.game.changeDifficulty()" 
            class="ui dropdown">
            <optgroup label="Above optimal">
            <option value="6400"       >God-like</option>
            <option value="1600"       >Boosted</option>
            </optgroup>
            <optgroup label="Level used during training">
            <option value="400"        >Native</option>
            </optgroup>
            <optgroup label="Sub optimal levels">
            <option value="100"        >Medium</option>
            <option value="25" selected>Easy</option>
            <option value="12"         >Easier</option>
            <option value="3"          >Come on</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
    <div class="fitted item"> 
      <div class="ui small form">
        <div class="field">
          <select class="ui dropdown" @change="$store.game.setGameMode($event.target.value)">
              <option value="P0" selected>You vs AI</option>
              <option value="P1">AI vs you</option>
              <option value="Human">No AI</option>
              <option value="AI">WarGames</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="ui main text container">

  <h1 class="ui huge center aligned header">Splendor with AI</h1> 
  <div class="ui hidden divider"></div>

  <template x-if="!$store.game.isLoading && $store.game.view && $store.game.view.tiers">
    <div>
      <div class="ui very compact equal width center aligned grid">
        <template x-for="(noble, index) in $store.game.view.nobles" :key="'noble-'+index">
          <div class="column">
            <template x-if="noble.length > 0">
              <svg class="svgS" viewBox="0 0 32 32">
                <rect width="100%" height="100%" :fill="colors[6][0]"/>
                <rect width="50%" height="100%" fill="white" fill-opacity="50%"/>
                
                <g x-show="noble && noble.length > 0">
                  <rect :x="'calc(' + tokensCoordNoble[0][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[0][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[noble?.[0]?.[0] || 0][1]" />
                  <text :x="tokensCoordNoble[0][0]" :y="tokensCoordNoble[0][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[noble?.[0]?.[0] || 0][2]" x-text="noble?.[0]?.[1] || ''"></text>
                </g>
                <g x-show="noble && noble.length > 1">
                  <rect :x="'calc(' + tokensCoordNoble[1][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[1][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[noble?.[1]?.[0] || 0][1]" />
                  <text :x="tokensCoordNoble[1][0]" :y="tokensCoordNoble[1][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[noble?.[1]?.[0] || 0][2]" x-text="noble?.[1]?.[1] || ''"></text>
                </g>
                <g x-show="noble && noble.length > 2">
                  <rect :x="'calc(' + tokensCoordNoble[2][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[2][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[noble?.[2]?.[0] || 0][1]" />
                  <text :x="tokensCoordNoble[2][0]" :y="tokensCoordNoble[2][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[noble?.[2]?.[0] || 0][2]" x-text="noble?.[2]?.[1] || ''"></text>
                </g>
              </svg>
            </template>
          </div>
        </template>
      </div>


      <div class="ui very compact equal width center aligned grid">
        <template x-for="tierIdx in [2, 1, 0]" :key="'tier-'+tierIdx">
          <div class="ui row">
            
            <div class="column">
              <svg class="svgL" viewBox="0 0 60 60" style="cursor: pointer;"
                   @click="$store.game.act('click_and_render', 'deck', tierIdx)">
                <polygon points="0,0 60,0 60,60 0,60" fill="black"/>
                <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" fill="darkgray" x-text="$store.game.view.decks[tierIdx] + ' cards'"></text>
                
                <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'deck' && $store.game.extra.sel_items[0] === tierIdx" />
                
                <circle cx="85%" cy="15%" r="5px" fill="tan" stroke="black" stroke-width="1" x-show="$store.game.extra?.last_action?.[0] === 'deck' && $store.game.extra?.last_action?.[1] === tierIdx" />
              </svg>
            </div>


            <template x-for="(card, cardIdx) in $store.game.view.tiers[tierIdx]" :key="'card-'+tierIdx+'-'+cardIdx">
              <div class="column">
                <a href="#" @click.prevent="card[0] >= 0 ? $store.game.act('click_and_render', 'card', tierIdx, cardIdx) : null">
                  <template x-if="card[0] >= 0">
                    <svg class="svgL" viewBox="0 0 60 60">
                      <rect width="100%" height="100%" :fill="colors[card[0]][0]"/>
                      <rect width="100%" height="30%" fill="white" fill-opacity="50%"/>
                      <rect width="13px" height="13px" x="65%" y="5%" :fill="colors[card[0]][1]"/>
                      <text x="25%" y="17%" text-anchor="middle" dominant-baseline="central" font-size="16px" font-weight="bolder" :fill="colors[card[0]][2]" x-show="card[1] > 0" x-text="card[1]"></text>
                      
                      <g x-show="card[2] && card[2].length > 0">
                        <circle :cx="tokensCoord[0][0]" :cy="tokensCoord[0][1]" r="0.5em" :fill="colors[card[2]?.[0]?.[0] || 0][1]" />
                        <text :x="tokensCoord[0][0]" :y="tokensCoord[0][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[0]?.[0] || 0][2]" x-text="card[2]?.[0]?.[1] || ''"></text>
                      </g>
                      <g x-show="card[2] && card[2].length > 1">
                        <circle :cx="tokensCoord[1][0]" :cy="tokensCoord[1][1]" r="0.5em" :fill="colors[card[2]?.[1]?.[0] || 0][1]" />
                        <text :x="tokensCoord[1][0]" :y="tokensCoord[1][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[1]?.[0] || 0][2]" x-text="card[2]?.[1]?.[1] || ''"></text>
                      </g>
                      <g x-show="card[2] && card[2].length > 2">
                        <circle :cx="tokensCoord[2][0]" :cy="tokensCoord[2][1]" r="0.5em" :fill="colors[card[2]?.[2]?.[0] || 0][1]" />
                        <text :x="tokensCoord[2][0]" :y="tokensCoord[2][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[2]?.[0] || 0][2]" x-text="card[2]?.[2]?.[1] || ''"></text>
                      </g>
                      <g x-show="card[2] && card[2].length > 3">
                        <circle :cx="tokensCoord[3][0]" :cy="tokensCoord[3][1]" r="0.5em" :fill="colors[card[2]?.[3]?.[0] || 0][1]" />
                        <text :x="tokensCoord[3][0]" :y="tokensCoord[3][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[3]?.[0] || 0][2]" x-text="card[2]?.[3]?.[1] || ''"></text>
                      </g>

                      <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'card' && $store.game.extra.sel_items[0] && $store.game.extra.sel_items[0][0] === tierIdx && $store.game.extra.sel_items[0][1] === cardIdx" />
                      <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:tan" x-show="$store.game.extra.sel_type === 'rsv' && $store.game.extra.sel_items[0] && $store.game.extra.sel_items[0][0] === tierIdx && $store.game.extra.sel_items[0][1] === cardIdx" />
                      <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="['card', 'rsv'].includes($store.game.extra?.last_action?.[0]) && $store.game.extra?.last_action?.[1] === (tierIdx * 4 + cardIdx)" />
                    </svg>
                  </template>
                  <template x-if="card[0] < 0">   
                    <svg class="svgL" viewBox="0 0 60 60"></svg>
                  </template>
                </a>
              </div>
            </template>


          </div>
        </template>
      </div>


      <div class="ui very compact equal width center aligned grid">
        <template x-for="(count, colorIdx) in $store.game.view.bank" :key="'bank-'+colorIdx">
          <div class="column">
            <template x-if="count > 0 || colorIdx === 5">
              <a href="#" @click.prevent="colorIdx < 5 ? $store.game.act('click_and_render', 'gem', colorIdx) : null">
                <svg class="svgM" viewBox="0 0 32 32">
                  <circle cx="50%" cy="50%" r="50%" :fill="colors[colorIdx][1]" />
                  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[colorIdx][2]" x-text="count"></text>
                  <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'gem' && $store.game.extra.sel_items.includes(colorIdx) && $store.game.extra.sel_items[0] !== $store.game.extra.sel_items[1]" />
                  <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:tan" x-show="$store.game.extra.sel_type === 'gem' && $store.game.extra.sel_items.includes(colorIdx) && $store.game.extra.sel_items[0] === $store.game.extra.sel_items[1]" />
                  <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="$store.game.extra?.last_action?.[0] === 'gem' && $store.game.extra?.last_action?.[1]?.includes(colorIdx)" />
                </svg>
              </a>
            </template>
            <template x-if="count === 0 && colorIdx < 5">
              <svg class="svgM" viewBox="0 0 32 32">
                <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'gem' && $store.game.extra.sel_items.includes(colorIdx)" />
              </svg>
            </template>
          </div>
        </template>
      </div>



      <div class="ui hidden divider mobile hidden"></div>
      <div class="ui fluid large compact buttons" x-show="!$store.game.isLoading">
        <button class="ui basic icon button" id="undoBtn" 
                @click="$store.game.act('undo')" 
                :class="{ 'disabled': !$store.game.canUndo || $store.game.isThinking || $store.game.extra.sel_type == 'none'}">
          <i class="undo icon"></i>
        </button>
        <button class="ui button" 
                id="btn_confirm"
                :class="{ 
                    'disabled basic': (!$store.game.extra.can_confirm && $store.game.extra.sel_type !== 'none') || $store.game.isThinking,
                    'green': $store.game.extra.can_confirm,
                    'green basic disabled': $store.game.extra.sel_type === 'none'
                }"
                @click="$store.game.act('confirm_action')"
                x-text="$store.game.extra.sel_type === 'none' ? 'CLICK ON A CARD OR A GEM' : ($store.game.extra.can_confirm ? 'Confirm to ' + $store.game.extra.move_desc : 'Cannot ' + $store.game.extra.move_desc)">
        </button>
      </div>

      <template x-for="(player, pIdx) in $store.game.view.players" :key="'player-'+pIdx">
        <div> <div class="ui hidden divider computer only"></div>
          <div class="ui horizontal divider" 
               x-html="(pIdx === 0 ? 'You' : ($store.game.arePlayersHuman[pIdx] ? 'Player '+pIdx : 'AI' + (pIdx===2 ? ' bis' : ''))) + ' - ' + player.points + ' point' + (player.points > 1 ? 's' : '') + (player.noble_points > 0 ? ' (incl. ' + player.noble_points + ' <i class=\'chess queen icon\'></i>)' : '') + ' - ' + player.total_gems + ' <i class=\'gem icon\'></i>'">
          </div>
          <div class="ui very compact equal width center aligned grid">
            
            <template x-for="(gCount, gIdx) in player.gems" :key="'p'+pIdx+'-gem-'+gIdx">
              <div class="column">
                <a href="#" @click.prevent="($store.game.currentPlayer === pIdx && pIdx === 0 && gIdx < 5) ? $store.game.act('click_and_render', 'gemback', gIdx) : null">
                  <template x-if="gCount > 0">
                    <svg class="svgS" viewBox="0 0 32 32">
                      <circle cx="50%" cy="50%" r="50%" :fill="colors[gIdx][1]" />
                      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[gIdx][2]" x-text="gCount"></text>
                      <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'gemback' && $store.game.extra.sel_items.includes(gIdx) && $store.game.extra.sel_items[0] !== $store.game.extra.sel_items[1]" />
                      <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:tan" x-show="$store.game.extra.sel_type === 'gemback' && $store.game.extra.sel_items.includes(gIdx) && $store.game.extra.sel_items[0] === $store.game.extra.sel_items[1]" />
                      <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="$store.game.extra?.last_action?.[0] === 'gemback' && $store.game.extra?.last_action?.[1]?.includes(gIdx) && pIdx === $store.game.extra?.previous_player" />
                    </svg>
                  </template>
                  <template x-if="gCount === 0">
                    <svg class="svgS" viewBox="0 0 32 32"></svg>
                  </template>
                </a>
              </div>
            </template>

            <template x-for="(cCount, cIdx) in player.cards" :key="'p'+pIdx+'-card-'+cIdx">
              <div class="column" x-show="cIdx < 5">
                <template x-if="cCount > 0">
                  <svg class="svgS" viewBox="0 0 32 32">
                    <rect width="100%" height="100%" :fill="colors[cIdx][1]" />
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[cIdx][2]" x-text="cCount"></text>
                  </svg>
                </template>
                <template x-if="cCount === 0">
                  <svg class="svgS" viewBox="0 0 32 32"></svg>
                </template>
              </div>
            </template>

            <template x-for="(rCard, rIdx) in player.reserved" :key="'p'+pIdx+'-res-'+rIdx">
              <div class="column">
               <a href="#" @click.prevent="($store.game.currentPlayer === pIdx && pIdx === 0) ? $store.game.act('click_and_render', 'reserved', rIdx) : null">
                 <template x-if="rCard[0] >= 0">
                   <svg class="svgS" viewBox="0 0 32 32">
                     <rect width="100%" height="100%" :fill="colors[rCard[0]][0]"/>
                     <rect width="100%" height="33%" fill="white" fill-opacity="50%"/>
                     <rect width="0.4em" height="0.5em" x="65%" y="5%" :fill="colors[rCard[0]][1]"/>
                     <text x="25%" y="17%" text-anchor="middle" dominant-baseline="central" font-size="0.7em" font-weight="bolder" :fill="colors[rCard[0]][2]" x-show="rCard[1] > 0" x-text="rCard[1]"></text>
                     
                     <g x-show="rCard[2] && rCard[2].length > 0">
                       <circle :cx="tokensCoordSmall[0][0]" :cy="tokensCoordSmall[0][1]" r="0.3em" :fill="colors[rCard[2]?.[0]?.[0] || 0][1]" />
                       <text :x="tokensCoordSmall[0][0]" :y="tokensCoordSmall[0][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[rCard[2]?.[0]?.[0] || 0][2]" x-text="rCard[2]?.[0]?.[1] || ''"></text>
                     </g>
                     <g x-show="rCard[2] && rCard[2].length > 1">
                       <circle :cx="tokensCoordSmall[1][0]" :cy="tokensCoordSmall[1][1]" r="0.3em" :fill="colors[rCard[2]?.[1]?.[0] || 0][1]" />
                       <text :x="tokensCoordSmall[1][0]" :y="tokensCoordSmall[1][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[rCard[2]?.[1]?.[0] || 0][2]" x-text="rCard[2]?.[1]?.[1] || ''"></text>
                     </g>
                     <g x-show="rCard[2] && rCard[2].length > 2">
                       <circle :cx="tokensCoordSmall[2][0]" :cy="tokensCoordSmall[2][1]" r="0.3em" :fill="colors[rCard[2]?.[2]?.[0] || 0][1]" />
                       <text :x="tokensCoordSmall[2][0]" :y="tokensCoordSmall[2][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[rCard[2]?.[2]?.[0] || 0][2]" x-text="rCard[2]?.[2]?.[1] || ''"></text>
                     </g>
                     <g x-show="rCard[2] && rCard[2].length > 3">
                       <circle :cx="tokensCoordSmall[3][0]" :cy="tokensCoordSmall[3][1]" r="0.3em" :fill="colors[rCard[2]?.[3]?.[0] || 0][1]" />
                       <text :x="tokensCoordSmall[3][0]" :y="tokensCoordSmall[3][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[rCard[2]?.[3]?.[0] || 0][2]" x-text="rCard[2]?.[3]?.[1] || ''"></text>
                     </g>

                     <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'card' && $store.game.extra.sel_items[0] && $store.game.extra.sel_items[0][0] === -1 && $store.game.extra.sel_items[0][1] === rIdx" />
                     <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="$store.game.extra?.last_action?.[0] === 'buyrsv' && $store.game.extra?.last_action?.[1] === rIdx && pIdx === $store.game.extra?.previous_player" />
                   </svg>
                 </template>
               </a>
             </div>
            </template>

          </div>
        </div>
      </template>

    </div>
  </template>

  <button x-show="$store.game.isLoading || $store.game.isThinking" class="ui fluid large active loading button">‌</button>

</div>


<div class="ui modal" id="editModal" x-data="splendorEditor()" x-init="initModal()">
  <i class="close inside icon"></i>
  <div class="header" x-text="step === 'card' ? 'Edit card - ' + ['1st','2nd','3rd','4th'][c_index] + ' on ' + ['bottom','middle','top'][c_tier] + ' line' : (step === 'noble' ? 'Edit nobles' : 'Edit bank/players')"></div>
  <div class="content">
    
    <template x-if="$store.game.view && $store.game.view.tiers">
      <div>
        <div x-show="step === 'card'">
          <div class="ui center aligned grid">
            <template x-for="i in [0,1,2,3]">
               <div class="two wide column">
                 <svg class="svgS" viewBox="0 0 32 32">
                   <rect width="100%" height="100%" :fill="colors[$store.game.view.tiers[c_tier][i][0] >= 0 ? $store.game.view.tiers[c_tier][i][0] : 0][0]"/>
                   <rect width="100%" height="33%" fill="white" fill-opacity="50%"/>
                   <rect width="0.4em" height="0.5em" x="65%" y="5%" :fill="colors[$store.game.view.tiers[c_tier][i][0] >= 0 ? $store.game.view.tiers[c_tier][i][0] : 0][1]"/>
                   <text x="25%" y="17%" text-anchor="middle" dominant-baseline="central" font-size="0.7em" font-weight="bolder" :fill="colors[$store.game.view.tiers[c_tier][i][0] >= 0 ? $store.game.view.tiers[c_tier][i][0] : 0][2]" x-show="$store.game.view.tiers[c_tier][i][1] > 0" x-text="$store.game.view.tiers[c_tier][i][1]"></text>
                   
                   <g x-show="$store.game.view.tiers[c_tier][i][2] && $store.game.view.tiers[c_tier][i][2].length > 0">
                     <circle :cx="tokensCoordSmall[0][0]" :cy="tokensCoordSmall[0][1]" r="0.3em" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[0]?.[0] || 0][1]" />
                     <text :x="tokensCoordSmall[0][0]" :y="tokensCoordSmall[0][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[0]?.[0] || 0][2]" x-text="$store.game.view.tiers[c_tier][i][2]?.[0]?.[1] || ''"></text>
                   </g>
                   <g x-show="$store.game.view.tiers[c_tier][i][2] && $store.game.view.tiers[c_tier][i][2].length > 1">
                     <circle :cx="tokensCoordSmall[1][0]" :cy="tokensCoordSmall[1][1]" r="0.3em" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[1]?.[0] || 0][1]" />
                     <text :x="tokensCoordSmall[1][0]" :y="tokensCoordSmall[1][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[1]?.[0] || 0][2]" x-text="$store.game.view.tiers[c_tier][i][2]?.[1]?.[1] || ''"></text>
                   </g>
                   <g x-show="$store.game.view.tiers[c_tier][i][2] && $store.game.view.tiers[c_tier][i][2].length > 2">
                     <circle :cx="tokensCoordSmall[2][0]" :cy="tokensCoordSmall[2][1]" r="0.3em" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[2]?.[0] || 0][1]" />
                     <text :x="tokensCoordSmall[2][0]" :y="tokensCoordSmall[2][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[2]?.[0] || 0][2]" x-text="$store.game.view.tiers[c_tier][i][2]?.[2]?.[1] || ''"></text>
                   </g>
                   <g x-show="$store.game.view.tiers[c_tier][i][2] && $store.game.view.tiers[c_tier][i][2].length > 3">
                     <circle :cx="tokensCoordSmall[3][0]" :cy="tokensCoordSmall[3][1]" r="0.3em" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[3]?.[0] || 0][1]" />
                     <text :x="tokensCoordSmall[3][0]" :y="tokensCoordSmall[3][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[$store.game.view.tiers[c_tier][i][2]?.[3]?.[0] || 0][2]" x-text="$store.game.view.tiers[c_tier][i][2]?.[3]?.[1] || ''"></text>
                   </g>

                   <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="c_index === i" />
                 </svg>
               </div>
            </template>
          </div>

          <div class="ui hidden divider"></div>
          <div class="ui large wrapped wrapping buttons">
            <template x-for="(cName, i) in ['White', 'Blue', 'Green', 'Red', 'Black']">
              <button class="ui button" :class="c_color === i ? colors[i][1].replace('dodgerblue','blue').replace('dimgray','black').replace('tomato','red').replace('lightgreen','green').replace('gainsboro','gray') : 'basic ' + colors[i][1].replace('dodgerblue','blue').replace('dimgray','black').replace('tomato','red').replace('lightgreen','green').replace('gainsboro','gray')" @click="setCardProp('c_color', i)" x-text="cName"></button>
            </template>
          </div>
          <div class="ui hidden divider"></div>
          <div class="ui large wrapped wrapping buttons">
            <template x-for="pts in [0,1,2,3,4,5]">
              <button class="ui button" :class="c_pts === pts ? '' : 'basic'" @click="setCardProp('c_pts', pts)" x-text="pts"></button>
            </template>
          </div>

          <div class="ui hidden divider"></div>
          <div class="ui text container"><div class="ui four column compact centered grid">
            <template x-for="(card, matchIdx) in $store.game.extra.matching_cards">
              <div class="column">
                <a href="#" @click.prevent="commitCard(matchIdx)">
                  <svg class="svgL" viewBox="0 0 60 60">
                     <rect width="100%" height="100%" :fill="colors[card[0]][0]"/>
                     <rect width="100%" height="30%" fill="white" fill-opacity="50%"/>
                     <rect width="13px" height="13px" x="65%" y="5%" :fill="colors[card[0]][1]"/>
                     <text x="25%" y="17%" text-anchor="middle" dominant-baseline="central" font-size="16px" font-weight="bolder" :fill="colors[card[0]][2]" x-show="card[1] > 0" x-text="card[1]"></text>
                     
                     <g x-show="card[2] && card[2].length > 0">
                       <circle :cx="tokensCoord[0][0]" :cy="tokensCoord[0][1]" r="0.5em" :fill="colors[card[2]?.[0]?.[0] || 0][1]" />
                       <text :x="tokensCoord[0][0]" :y="tokensCoord[0][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[0]?.[0] || 0][2]" x-text="card[2]?.[0]?.[1] || ''"></text>
                     </g>
                     <g x-show="card[2] && card[2].length > 1">
                       <circle :cx="tokensCoord[1][0]" :cy="tokensCoord[1][1]" r="0.5em" :fill="colors[card[2]?.[1]?.[0] || 0][1]" />
                       <text :x="tokensCoord[1][0]" :y="tokensCoord[1][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[1]?.[0] || 0][2]" x-text="card[2]?.[1]?.[1] || ''"></text>
                     </g>
                     <g x-show="card[2] && card[2].length > 2">
                       <circle :cx="tokensCoord[2][0]" :cy="tokensCoord[2][1]" r="0.5em" :fill="colors[card[2]?.[2]?.[0] || 0][1]" />
                       <text :x="tokensCoord[2][0]" :y="tokensCoord[2][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[2]?.[0] || 0][2]" x-text="card[2]?.[2]?.[1] || ''"></text>
                     </g>
                     <g x-show="card[2] && card[2].length > 3">
                       <circle :cx="tokensCoord[3][0]" :cy="tokensCoord[3][1]" r="0.5em" :fill="colors[card[2]?.[3]?.[0] || 0][1]" />
                       <text :x="tokensCoord[3][0]" :y="tokensCoord[3][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[card[2]?.[3]?.[0] || 0][2]" x-text="card[2]?.[3]?.[1] || ''"></text>
                     </g>

                     <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="card.toString() === $store.game.view.tiers[c_tier][c_index].toString()" />
                  </svg>
                </a>
              </div>
            </template>
          </div></div>
        </div>

        <div x-show="step === 'noble'">
          <div class="ui equal width compact center aligned grid">
            <template x-for="s in [0,1,2,3]">
              <div class="column"><a href="#" @click.prevent="n_slot = s">
                 <svg class="svgS" viewBox="0 0 32 32">
                    <rect width="100%" height="100%" :fill="colors[6][0]"/>
                    <rect width="50%" height="100%" fill="white" fill-opacity="50%"/>
                    
                    <g x-show="n_ids[s] >= 0 && all_nobles[n_ids[s]].length > 0">
                       <rect :x="'calc(' + tokensCoordNoble[0][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[0][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[all_nobles[n_ids[s]]?.[0]?.[0] || 0][1]" />
                       <text :x="tokensCoordNoble[0][0]" :y="tokensCoordNoble[0][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[all_nobles[n_ids[s]]?.[0]?.[0] || 0][2]" x-text="all_nobles[n_ids[s]]?.[0]?.[1] || ''"></text>
                    </g>
                    <g x-show="n_ids[s] >= 0 && all_nobles[n_ids[s]].length > 1">
                       <rect :x="'calc(' + tokensCoordNoble[1][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[1][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[all_nobles[n_ids[s]]?.[1]?.[0] || 0][1]" />
                       <text :x="tokensCoordNoble[1][0]" :y="tokensCoordNoble[1][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[all_nobles[n_ids[s]]?.[1]?.[0] || 0][2]" x-text="all_nobles[n_ids[s]]?.[1]?.[1] || ''"></text>
                    </g>
                    <g x-show="n_ids[s] >= 0 && all_nobles[n_ids[s]].length > 2">
                       <rect :x="'calc(' + tokensCoordNoble[2][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[2][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[all_nobles[n_ids[s]]?.[2]?.[0] || 0][1]" />
                       <text :x="tokensCoordNoble[2][0]" :y="tokensCoordNoble[2][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[all_nobles[n_ids[s]]?.[2]?.[0] || 0][2]" x-text="all_nobles[n_ids[s]]?.[2]?.[1] || ''"></text>
                    </g>

                    <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="n_slot === s" />
                 </svg>
              </a></div>
            </template>
          </div>

          <div class="ui hidden divider"></div>Change by any noble in the list:<br>
          
          <div class="ui five column compact centered grid">
             <template x-for="(noble, nIdx) in all_nobles" :key="'avail-noble-'+nIdx">
                <div class="column"><a href="#" @click.prevent="n_ids[n_slot] = nIdx; commitNoble()">
                   <svg class="svgS" viewBox="0 0 32 32">
                      <rect width="100%" height="100%" :fill="colors[6][0]"/>
                      <rect width="50%" height="100%" fill="white" fill-opacity="50%"/>
                      
                      <g x-show="noble && noble.length > 0">
                        <rect :x="'calc(' + tokensCoordNoble[0][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[0][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[noble?.[0]?.[0] || 0][1]" />
                        <text :x="tokensCoordNoble[0][0]" :y="tokensCoordNoble[0][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[noble?.[0]?.[0] || 0][2]" x-text="noble?.[0]?.[1] || ''"></text>
                      </g>
                      <g x-show="noble && noble.length > 1">
                        <rect :x="'calc(' + tokensCoordNoble[1][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[1][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[noble?.[1]?.[0] || 0][1]" />
                        <text :x="tokensCoordNoble[1][0]" :y="tokensCoordNoble[1][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[noble?.[1]?.[0] || 0][2]" x-text="noble?.[1]?.[1] || ''"></text>
                      </g>
                      <g x-show="noble && noble.length > 2">
                        <rect :x="'calc(' + tokensCoordNoble[2][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[2][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[noble?.[2]?.[0] || 0][1]" />
                        <text :x="tokensCoordNoble[2][0]" :y="tokensCoordNoble[2][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[noble?.[2]?.[0] || 0][2]" x-text="noble?.[2]?.[1] || ''"></text>
                      </g>

                   </svg>
                </a></div>
             </template>
          </div>
          <div class="ui fluid large wrapped wrapping buttons">
            <button class="ui button" :class="n_assigns[n_slot] === -1 ? '' : 'basic'" @click="n_assigns[n_slot] = -1; commitNoble()">Not won</button>
            <template x-for="pIdx in $store.game.view.players.length">
                <button class="ui button" :class="n_assigns[n_slot] === (pIdx-1) ? '' : 'basic'" @click="n_assigns[n_slot] = (pIdx-1); commitNoble()" x-text="'Won by P' + (pIdx-1)"></button>
            </template>
          </div>
        </div>

        <div x-show="step === 'gem'">
          <div class="ui fluid large buttons">
            <button class="ui button" :class="g_player === -1 ? '' : 'basic'" @click="g_player = -1">Bank</button>
            <template x-for="pIdx in $store.game.view.players.length">
               <button class="ui button" :class="g_player === (pIdx-1) ? '' : 'basic'" @click="g_player = (pIdx-1)" x-text="'Player ' + (pIdx-1)"></button>
            </template>
          </div>

          <div class="ui hidden divider"></div>
          <div class="ui equal width compact center aligned grid">
            <template x-for="color in [0,1,2,3,4,5]">
               <div class="column">
                 <button class="ui basic large button" @click="commitGem('gem', color, 1)">+</button>
                 <svg class="svgS" viewBox="0 0 32 32">
                    <circle cx="50%" cy="50%" r="50%" :fill="colors[color][1]" />
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[color][2]" 
                          x-text="g_player === -1 ? $store.game.view.bank[color] : $store.game.view.players[g_player].gems[color]"></text>
                 </svg>
                 <button class="ui basic large button" @click="commitGem('gem', color, -1)">-</button>
               </div>
            </template>
          </div>

          <div class="ui hidden divider" x-show="g_player >= 0"></div>
          <div class="ui equal width compact center aligned grid" x-show="g_player >= 0">
            <template x-for="color in [0,1,2,3,4]">
               <div class="column">
                 <button class="ui basic large button" @click="commitGem('card', color, 1)">+</button>
                 <svg class="svgS" viewBox="0 0 32 32">
                    <rect width="100%" height="100%" :fill="colors[color][1]" />
                    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[color][2]" 
                          x-text="$store.game.view.players[g_player]?.cards[color]"></text>
                 </svg>
                 <button class="ui basic large button" @click="commitGem('card', color, -1)">-</button>
               </div>
            </template>
            <div class="column"></div>
          </div>
        </div>
      </div>
    </template>
  </div>
  
  <div class="actions">
    <div class="ui primary button" @click="if(step === 'card') gotoNoble(); else if(step === 'noble') gotoGem(); else $('#editModal').modal('hide');" x-text="step === 'card' ? 'Edit nobles' : (step === 'noble' ? 'Edit gems' : 'Close')"></div>
  </div>
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('splendorEditor', () => ({
      step: 'card',
      c_tier: 0, c_index: 0, c_color: 0, c_pts: 0,
      n_slot: 0, n_assigns: [-1,-1,-1,-1], n_ids: [-2,-2,-2,-2],
      g_player: -1,

      initModal() {
        this.$watch('$store.game.editMode', val => {
            if (val > 0) {
                this.resetToCard(0, 0);
                $('#editModal').modal({
                    onHide: () => { 
                        if (Alpine.store('game').editMode !== 0) {
                            pyodide.runPythonAsync(`proxy.set_edit_mode(0)`).then(j => update_store(j));
                        }
                    }
                }).modal('show');
            } else {
                $('#editModal').modal('hide');
            }
        });
      },
      
      resetToCard(tier, index) {
        this.step = 'card';
        this.c_tier = tier;
        this.c_index = index;
        let card = Alpine.store('game').view.tiers[tier][index];
        this.c_color = card[0] >= 0 ? card[0] : 0;
        this.c_pts = card[1] >= 0 ? card[1] : 0;
        Alpine.store('game').act('filter_cards', this.c_tier, this.c_color, this.c_pts);
      },

      setCardProp(prop, val) {
        this[prop] = val;
        Alpine.store('game').act('filter_cards', this.c_tier, this.c_color, this.c_pts);
      },
      
      commitCard(cardIdx) {
        Alpine.store('game').act('change_deck_card', this.c_tier, this.c_color, this.c_pts, cardIdx, this.c_index);
        let n_tier = (this.c_index === 3) ? this.c_tier + 1 : this.c_tier;
        let n_index = (this.c_index + 1) % 4;
        if (n_tier >= 3) this.gotoNoble(); else this.resetToCard(n_tier, n_index);
      },

      gotoNoble() {
        this.step = 'noble';
        this.n_slot = 0;
        let v_nobles = Alpine.store('game').view.nobles;
        for(let i=0; i<4; i++) {
            if (i < v_nobles.length && v_nobles[i].length > 0) {
                this.n_ids[i] = this.findNobleId(v_nobles[i]);
            } else {
                this.n_ids[i] = -1; 
            }
            this.n_assigns[i] = -1;
        }
      },
      
      findNobleId(tokensJS) {
         let tokStr = tokensJS.toString();
         for(let i=0; i<all_nobles.length; i++) if (all_nobles[i].toString() === tokStr) return i;
         return -1;
      },

      commitNoble() {
         Alpine.store('game').act('change_noble', this.n_slot, this.n_ids[this.n_slot], this.n_assigns[this.n_slot]);
         if (this.n_slot < ($store.game.view.players.length - 1)) this.n_slot++; else this.gotoGem();
      },

      gotoGem() { this.step = 'gem'; this.g_player = -1; },
      
      commitGem(type, color, delta) {
         Alpine.store('game').act('change_gem', this.g_player, color, type, delta);
      }
    }));
  });
</script>

</div></body>
</html>
