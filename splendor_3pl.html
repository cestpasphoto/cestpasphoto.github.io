<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splendor AI</title>
  
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
  
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/ort.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  
  <script src="./splendor/constants_3pl.js"></script> <script src="./common/game.js"></script> <script src="./splendor/splendor.js"></script> <style>
    /* Couleurs de base avec !important pour écraser Fomantic UI */
    .c-white { background-color: ghostwhite !important; color: black !important; border: 1px solid #ccc !important; }
    .c-blue { background-color: dodgerblue !important; color: white !important; }
    .c-green { background-color: lightgreen !important; color: black !important; }
    .c-red { background-color: tomato !important; color: white !important; }
    .c-black { background-color: dimgray !important; color: white !important; }
    .c-yellow { background-color: gold !important; color: black !important; } /* Or / Joker */
    
    .gem-token { width: 50px; height: 50px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; margin: 5px; border: 2px solid transparent;}
    .gem-token.selected { border-color: #000; box-shadow: 0 0 10px rgba(0,0,0,0.5); transform: scale(1.1); }
    .gem-token.disabled { opacity: 0.3; cursor: not-allowed; }
    
    .splendor-card { min-height: 120px; cursor: pointer; border: 2px solid transparent; }
    .splendor-card:hover { border-color: #2185d0; }
  </style>
</head>

<body class="ui container" style="padding-top: 20px;">

  <div x-data x-init="$store.game.start()">

    <div class="ui borderless menu">
      <div class="item"><div class="ui header">Splendor</div></div>
      
      <div class="item">
        <div class="ui form"><div class="inline fields" style="margin-bottom: 0;">
          <template x-for="(isHuman, idx) in $store.game.arePlayersHuman" :key="idx">
            <div class="field" style="margin-right: 15px;">
              <label x-text="'P' + idx + ':'"></label>
              <select x-model.boolean="$store.game.arePlayersHuman[idx]" @change="$store.game.trigger_ai_check()" class="ui dropdown compact">
                <option :value="true" :selected="$store.game.arePlayersHuman[idx] === true">Humain</option>
                <option :value="false" :selected="$store.game.arePlayersHuman[idx] === false">IA</option>
              </select>
            </div>
          </template>
        </div></div>
      </div>

      <div class="right menu">
        <div class="item">
          <button class="ui icon button" @click="$store.game.undo()" :disabled="!$store.game.canUndo || $store.game.isLoading || $store.game.isThinking">
            <i class="undo icon"></i>
          </button>
        </div>
        <div class="item">
          <button class="ui icon button" @click="$store.game.reset()" :disabled="$store.game.isLoading || $store.game.isThinking">
            <i class="sync icon"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="ui center aligned basic segment">
      <div x-show="$store.game.isLoading" class="ui active inline loader"></div>
      <div x-show="$store.game.isThinking" class="ui active centered inline loader text">L'IA réfléchit...</div>
      <h2 x-show="!$store.game.isLoading && !$store.game.isThinking" class="ui header" x-text="$store.game.statusMessage"></h2>
    </div>

    <div x-show="$store.game.view && !$store.game.isLoading" class="ui grid">
      
      <div class="four wide column">
        <h4 class="ui dividing header">Nobles</h4>
        <div class="ui cards">
          <template x-for="(noble, idx) in $store.game.view.nobles" :key="idx">
            <div class="ui card" x-show="noble">
              <div class="content"><div class="header" x-text="noble ? noble.points + ' pts' : ''"></div></div>
            </div>
          </template>
        </div>

        <h4 class="ui dividing header">Banque</h4>
        <div>
          <template x-for="gem in $store.game.view.bank" :key="gem.colorIdx">
            <div class="gem-token" 
                 :class="['c-' + gem.colorName, gem.isSelected ? 'selected' : '', !gem.isAvailable ? 'disabled' : '']"
                 @click="gem.isAvailable ? $store.game.act('toggle_gem', gem.colorIdx) : null">
              <span x-text="gem.qty"></span>
            </div>
          </template>
        </div>
        
        <button class="ui fluid primary button" 
                style="margin-top: 10px;"
                x-show="$store.game.view.canConfirmGems"
                @click="$store.game.act('confirm_gems')">
          Prendre ces gemmes
        </button>
      </div>

      <div class="eight wide column">
        <h4 class="ui dividing header">Cartes disponibles</h4>
        <template x-for="(tier, tierIdx) in $store.game.view.tiers" :key="tierIdx">
          <div class="ui four cards" style="margin-bottom: 15px;">
            <template x-for="(card, cardIdx) in tier" :key="cardIdx">
              <div class="ui card splendor-card" x-show="card" @click="card ? $store.game.act('buy_card', tierIdx, cardIdx) : null">
                <div class="content" x-show="card">
                  <div class="right floated meta" :class="'c-' + card?.color"><strong x-text="card?.points > 0 ? card.points : ''"></strong></div>
                  <div class="header" x-text="card?.color"></div>
                  <div class="description">
                    <template x-for="(cost, cIdx) in card?.cost" :key="cIdx">
                      <span class="ui circular label small" 
                            x-show="cost > 0"
                            :class="'c-' + ['white', 'blue', 'green', 'red', 'black'][cIdx]"
                            x-text="cost">
                      </span>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

      <div class="four wide column">
        <h4 class="ui dividing header">Joueurs</h4>
        <div class="ui segments">
          <template x-for="p in $store.game.view.players" :key="p.id">
            <div class="ui segment" :class="p.isCurrentTurn ? 'secondary inverted blue' : ''">
              <h5 class="ui header">
                Joueur <span x-text="p.id"></span> 
                <div class="sub header"><span x-text="p.score"></span> Points</div>
              </h5>
              <div>
                <template x-for="(qty, cIdx) in p.gems" :key="'g'+cIdx">
                  <span class="ui circular label empty mini" x-show="qty > 0" x-text="qty"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
