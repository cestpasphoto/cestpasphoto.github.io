<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.0/dist/ort.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
</head>
<script src="./common/game.js"></script>
<script src="./splendor/constants_3pl.js"></script>
<script src="./splendor/splendor.js"></script>
<style>
  /* Computer / Desktop / iPad Landscape */
  @media only screen and (min-width: 992px) {
    [class*="mobile only"]:not(.computer), [class*="tablet only"]:not(.computer), [class*="computer hidden"] {
      display: none !important;
    }
    [class*="svgS"] { width: 3.5rem; max-width: 100%; }
    [class*="svgM"] { width: 4.0rem; max-width: 100%; }
    [class*="svgL"] { width: 7.0rem; max-width: 100%; }
  }

  /* Tablet / iPad Portrait */
  @media only screen and (min-width: 768px) and (max-width: 991px) {
    [class*="mobile only"]:not(.tablet), [class*="tablet hidden"], [class*="computer only"]:not(.tablet) {
      display: none !important;
    }
    [class*="svgS"] { width: 2.6rem; max-width: 100%; }
    [class*="svgM"] { width: 3.5rem; max-width: 100%; }
    [class*="svgL"] { width: 5.0rem; max-width: 100%; }
  }

  /* Mobile */
  @media only screen and                        (max-width: 767px) {
    [class*="mobile hidden"], [class*="tablet only"]:not(.mobile), [class*="computer only"]:not(.mobile) {
      display: none !important;
    }
    [class*="svgS"] { width: 2.2rem; max-width: 100%; }
    [class*="svgM"] { width: 2.8rem; max-width: 100%; }
    [class*="svgL"] { width: 4.5rem; max-width: 100%; }
  }
</style>
<body><div x-data x-init="$store.game.start()">

<div class="ui borderless menu">
  <div class="ui container">    
    <div class="fitted item">
      <button class="ui icon button" @click="$store.game.reset()">
        <i class="file outline icon"></i>
      </button>  
    </div> 
    <div class="fitted item"> 
      <button class="ui icon button" @click="$store.game.toggleEdit()"><i class="edit icon"></i></button>
    </div>
    <div class="fitted item"> 
      <div class="ui small form">
        <div class="field">
          <select 
            x-model.number="$store.game.numMCTSSims" 
            @change="$store.game.changeDifficulty()" 
            class="ui dropdown">
            <optgroup label="Above optimal">
            <option value="6400"       >God-like</option>
            <option value="1600"       >Boosted</option>
            </optgroup>
            <optgroup label="Level used during training">
            <option value="400"        >Native</option>
            </optgroup>
            <optgroup label="Sub optimal levels">
            <option value="100"        >Medium</option>
            <option value="25" selected>Easy</option>
            <option value="12"         >Easier</option>
            <option value="3"          >Come on</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
    <div class="fitted item"> 
      <div class="ui small form">
        <div class="field">
          <select class="ui dropdown" @change="$store.game.setGameMode($event.target.value)">
              <option value="P0" selected>You vs AI</option>
              <option value="P1">AI vs you</option>
              <option value="Human">No AI</option>
              <option value="AI">WarGames</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="ui main text container">

  <h1 class="ui huge center aligned header">Splendor with AI</h1> 
  <div class="ui hidden divider"></div>

  <div class="ui very compact equal width center aligned grid">
    <template x-for="(noble, index) in $store.game.view.nobles" :key="'noble-'+index">
      <div class="column">
        <template x-if="noble.length > 0">
          <svg class="svgS" viewBox="0 0 32 32">
            <rect width="100%" height="100%" :fill="colors[6][0]"/>
            <rect width="50%" height="100%" fill="white" fill-opacity="50%"/>
            <template x-for="(req, rIdx) in noble">
              <g>
                <rect :x="'calc(' + tokensCoordNoble[rIdx][0] + ' - 0.3em)'" :y="'calc(' + tokensCoordNoble[rIdx][1] + ' - 0.3em)'" width="0.6em" height="0.6em" :fill="colors[req[0]][1]" />
                <text :x="tokensCoordNoble[rIdx][0]" :y="tokensCoordNoble[rIdx][1]" text-anchor="middle" dominant-baseline="central" font-size="0.5em" font-weight="bolder" :fill="colors[req[0]][2]" x-text="req[1]"></text>
              </g>
            </template>
          </svg>
        </template>
      </div>
    </template>
  </div>


  <div class="ui very compact equal width center aligned grid">
    <template x-for="tierIdx in [2, 1, 0]" :key="'tier-'+tierIdx">
      <div class="row">
        
        <div class="column">
          <svg class="svgL" viewBox="0 0 60 60" style="cursor: pointer;"
               @click="$store.game.act('click_and_render', 'deck', tierIdx)">
            <polygon points="0,0 60,0 60,60 0,60" fill="black"/>
            <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" fill="darkgray" x-text="$store.game.view.decks[tierIdx] + ' cards'"></text>
            
            <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'deck' && $store.game.extra.sel_items[0] === tierIdx" />
            
            <circle cx="85%" cy="15%" r="5px" fill="tan" stroke="black" stroke-width="1" x-show="$store.game.extra?.last_action?.[0] === 'deck' && $store.game.extra?.last_action?.[1] === tierIdx" />
          </svg>
        </div>

        <div class="column">
          <template x-for="(card, cardIdx) in $store.game.view.tiers[tierIdx]" :key="'card-'+tierIdx+'-'+cardIdx">
            <a href="#" @click.prevent="card[0] >= 0 ? $store.game.act('click_and_render', 'card', tierIdx, cardIdx) : null">
              <template x-if="card[0] >= 0">
                <svg class="svgL" viewBox="0 0 60 60">
                  <rect width="100%" height="100%" :fill="colors[card[0]][0]"/>
                  <rect width="100%" height="30%" fill="white" fill-opacity="50%"/>
                  <rect width="13px" height="13px" x="65%" y="5%" :fill="colors[card[0]][1]"/>
                  <text x="25%" y="17%" text-anchor="middle" dominant-baseline="central" font-size="16px" font-weight="bolder" :fill="colors[card[0]][2]" x-show="card[1] > 0" x-text="card[1]"></text>
                  <template x-for="(token, tIdx) in card[2]">
                    <g>
                      <circle :cx="tokensCoord[tIdx][0]" :cy="tokensCoord[tIdx][1]" r="0.5em" :fill="colors[token[0]][1]" />
                      <text :x="tokensCoord[tIdx][0]" :y="tokensCoord[tIdx][1]" text-anchor="middle" dominant-baseline="central" font-size="0.9em" font-weight="bolder" :fill="colors[token[0]][2]" x-text="token[1]"></text>
                    </g>
                  </template>
                  <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'card' && $store.game.extra.sel_items[0] && $store.game.extra.sel_items[0][0] === tierIdx && $store.game.extra.sel_items[0][1] === cardIdx" />
                  <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:tan" x-show="$store.game.extra.sel_type === 'rsv' && $store.game.extra.sel_items[0] && $store.game.extra.sel_items[0][0] === tierIdx && $store.game.extra.sel_items[0][1] === cardIdx" />
                  <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="['card', 'rsv'].includes($store.game.extra?.last_action?.[0]) && $store.game.extra?.last_action?.[1] === (tierIdx * 4 + cardIdx)" />
                </svg>
              </template>
              <template x-if="card[0] < 0">
                 <svg class="svgL" viewBox="0 0 60 60"></svg>
              </template>
            </a>
          </template>
        </div
        >
      </div>
    </template>
  </div>


  <div class="ui very compact equal width center aligned grid">
    <template x-for="(count, colorIdx) in $store.game.view.bank" :key="'bank-'+colorIdx">
      <div class="column">
        <template x-if="count > 0 || colorIdx === 5">
          <a href="#" @click.prevent="colorIdx < 5 ? $store.game.act('click_and_render', 'gem', colorIdx) : null">
            <svg class="svgM" viewBox="0 0 32 32">
              <circle cx="50%" cy="50%" r="50%" :fill="colors[colorIdx][1]" />
              <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[colorIdx][2]" x-text="count"></text>
              <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'gem' && $store.game.extra.sel_items.includes(colorIdx) && $store.game.extra.sel_items[0] !== $store.game.extra.sel_items[1]" />
              <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:tan" x-show="$store.game.extra.sel_type === 'gem' && $store.game.extra.sel_items.includes(colorIdx) && $store.game.extra.sel_items[0] === $store.game.extra.sel_items[1]" />
              <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="$store.game.extra?.last_action?.[0] === 'gem' && $store.game.extra?.last_action?.[1]?.includes(colorIdx)" />
            </svg>
          </a>
        </template>
        <template x-if="count === 0 && colorIdx < 5">
          <svg class="svgM" viewBox="0 0 32 32">
            <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'gem' && $store.game.extra.sel_items.includes(colorIdx)" />
          </svg>
        </template>
      </div>
    </template>
  </div>



  <div class="ui hidden divider mobile hidden"></div>
  <div class="ui fluid large compact buttons" x-show="!$store.game.isLoading && !$store.game.isThinking && $store.game.extra.sel_type !== 'none'">
    <button class="ui basic icon button" id="undoBtn" 
            @click="$store.game.act('undo')" 
            :class="{ 'disabled': !$store.game.canUndo }">
      <i class="undo icon"></i>
    </button>
    <button class="ui button" 
            id="btn_confirm"
            :class="{ 
                'disabled basic': !$store.game.extra.can_confirm && $store.game.extra.sel_type !== 'none',
                'green': $store.game.extra.can_confirm,
                'green basic disabled': $store.game.extra.sel_type === 'none'
            }"
            @click="$store.game.act('confirm_action')"
            x-text="$store.game.extra.sel_type === 'none' ? 'CLICK ON A CARD OR A GEM' : ($store.game.extra.can_confirm ? 'Confirm to ' + $store.game.extra.move_desc : 'Cannot ' + $store.game.extra.move_desc)">
    </button>
  </div>

  <button x-show="$store.game.isLoading || $store.game.isThinking" class="ui fluid large active loading button">‌</button>

  <template x-for="(player, pIdx) in $store.game.view.players" :key="'player-'+pIdx">
    <div class="ui hidden divider computer only"></div>
    <div class="ui horizontal divider" 
         x-html="(pIdx === 0 ? 'You' : ($store.game.arePlayersHuman[pIdx] ? 'Player '+pIdx : 'AI' + (pIdx===2 ? ' bis' : ''))) + ' - ' + player.points + ' point' + (player.points > 1 ? 's' : '') + (player.noble_points > 0 ? ' (incl. ' + player.noble_points + ' <i class=\'chess queen icon\'></i>)' : '') + ' - ' + player.total_gems + ' <i class=\'gem icon\'></i>'">
    </div>
    <div class="ui very compact equal width center aligned grid">
      
      <template x-for="(gCount, gIdx) in player.gems" :key="'p'+pIdx+'-gem-'+gIdx">
        <div class="column">
          <a href="#" @click.prevent="($store.game.currentPlayer === pIdx && pIdx === 0 && gIdx < 5) ? $store.game.act('click_and_render', 'gemback', gIdx) : null">
            <template x-if="gCount > 0 || gIdx === 5">
              <svg class="svgS" viewBox="0 0 32 32">
                <circle cx="50%" cy="50%" r="50%" :fill="colors[gIdx][1]" />
                <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[gIdx][2]" x-text="gCount"></text>
                <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'gemback' && $store.game.extra.sel_items.includes(gIdx) && $store.game.extra.sel_items[0] !== $store.game.extra.sel_items[1]" />
                <circle cx="50%" cy="50%" r="45%" style="fill:none;stroke-width:10%;stroke:tan" x-show="$store.game.extra.sel_type === 'gemback' && $store.game.extra.sel_items.includes(gIdx) && $store.game.extra.sel_items[0] === $store.game.extra.sel_items[1]" />
                <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="$store.game.extra?.last_action?.[0] === 'gemback' && $store.game.extra?.last_action?.[1]?.includes(gIdx) && pIdx === $store.game.extra?.previous_player" />
              </svg>
            </template>
            <template x-if="gCount === 0 && gIdx < 5">
              <svg class="svgS" viewBox="0 0 32 32"></svg>
            </template>
          </a>
        </div>
      </template>

      <template x-for="(cCount, cIdx) in player.cards" :key="'p'+pIdx+'-card-'+cIdx">
        <template x-if="cIdx < 5">
          <div class="column">
            <template x-if="cCount > 0">
              <svg class="svgS" viewBox="0 0 32 32">
                <rect width="100%" height="100%" :fill="colors[cIdx][1]" />
                <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="1.5em" font-weight="bolder" :fill="colors[cIdx][2]" x-text="cCount"></text>
              </svg>
            </template>
            <template x-if="cCount === 0">
              <svg class="svgS" viewBox="0 0 32 32"></svg>
            </template>
          </div>
        </template>
      </template>

      <template x-for="(rCard, rIdx) in player.reserved" :key="'p'+pIdx+'-res-'+rIdx">
        <div class="column">
         <a href="#" @click.prevent="($store.game.currentPlayer === pIdx && pIdx === 0) ? $store.game.act('click_and_render', 'reserved', rIdx) : null">
           <template x-if="rCard[0] >= 0">
             <svg class="svgS" viewBox="0 0 32 32">
               <rect width="100%" height="100%" :fill="colors[rCard[0]][0]"/>
               <rect width="100%" height="33%" fill="white" fill-opacity="50%"/>
               <rect width="0.4em" height="0.5em" x="65%" y="5%" :fill="colors[rCard[0]][1]"/>
               <text x="25%" y="17%" text-anchor="middle" dominant-baseline="central" font-size="0.7em" font-weight="bolder" :fill="colors[rCard[0]][2]" x-show="rCard[1] > 0" x-text="rCard[1]"></text>
               <template x-for="(token, tIdx) in rCard[2]">
                 <g>
                   <circle :cx="tokensCoordSmall[tIdx][0]" :cy="tokensCoordSmall[tIdx][1]" r="0.3em" :fill="colors[token[0]][1]" />
                   <text :x="tokensCoordSmall[tIdx][0]" :y="tokensCoordSmall[tIdx][1]" text-anchor="middle" dominant-baseline="central" font-size="0.6em" font-weight="bolder" :fill="colors[token[0]][2]" x-text="token[1]"></text>
                 </g>
               </template>
               <rect width="100%" height="100%" style="fill:none;stroke-width:10%;stroke:aquamarine" x-show="$store.game.extra.sel_type === 'card' && $store.game.extra.sel_items[0] && $store.game.extra.sel_items[0][0] === -1 && $store.game.extra.sel_items[0][1] === rIdx" />
               <circle cx="85%" cy="15%" r="5px" fill="tan" x-show="$store.game.extra?.last_action?.[0] === 'buyrsv' && $store.game.extra?.last_action?.[1] === rIdx && pIdx === $store.game.extra?.previous_player" />
             </svg>
           </template>
         </a>
       </div>
      </template>

    </div>
  </template>


</div>




<div class="ui modal">
  <i class="close inside icon"></i>
  <div class="header" id="mod_head"></div>
  <div class="content">
    <div id="card_editor">

      <div class="ui center aligned grid">
        <div class="two wide column"><div id="editor_info0"></div></div>
        <div class="two wide column"><div id="editor_info1"></div></div>
        <div class="two wide column"><div id="editor_info2"></div></div>
        <div class="two wide column"><div id="editor_info3"></div></div>
      </div>

      <div class="ui hidden divider"></div>
      <div class="ui large wrapped wrapping buttons">
        <button class="ui gray basic button" id="mod_but_col0" onclick="cardEditor.buttonClick(this.id)">White</button>
        <button class="ui blue basic button" id="mod_but_col1" onclick="cardEditor.buttonClick(this.id)">Blue</button>
        <button class="ui green basic button" id="mod_but_col2" onclick="cardEditor.buttonClick(this.id)">Green</button>
        <button class="ui red basic button" id="mod_but_col3" onclick="cardEditor.buttonClick(this.id)">Red</button>
        <button class="ui black basic button" id="mod_but_col4" onclick="cardEditor.buttonClick(this.id)">Black</button>
      </div>

      <div class="ui hidden divider"></div>
      <div class="ui large wrapped wrapping buttons">
        <button class="ui basic button" id="mod_but_pts0" onclick="cardEditor.buttonClick(this.id)">0</button>
        <button class="ui basic button" id="mod_but_pts1" onclick="cardEditor.buttonClick(this.id)">1</button>
        <button class="ui basic button" id="mod_but_pts2" onclick="cardEditor.buttonClick(this.id)">2</button>
        <button class="ui basic button" id="mod_but_pts3" onclick="cardEditor.buttonClick(this.id)">3</button>
        <button class="ui basic button" id="mod_but_pts4" onclick="cardEditor.buttonClick(this.id)">4</button>
        <button class="ui basic button" id="mod_but_pts5" onclick="cardEditor.buttonClick(this.id)">5</button>
      </div>

      <div class="ui hidden divider"></div>
      <div class="ui text container">
        <div class="ui four column compact centered grid">
          <div class="column" id="sel_c0"></div>
          <div class="column" id="sel_c1"></div>
          <div class="column" id="sel_c2"></div>
          <div class="column" id="sel_c3"></div>

          <div class="column" id="sel_c4"></div>
          <div class="column" id="sel_c5"></div>
          <div class="column" id="sel_c6"></div>
          <div class="column" id="sel_c7"></div>
        </div>
      </div>
    </div>

    <div id="noble_editor" style="display: none">
      <div class="ui equal width compact center aligned grid" id="noble_slots">
        <div class="column"><div id="bank_noble0" onclick="nobleEditor.buttonClick(this.id);event.preventDefault();"></div></div>
        <div class="column"><div id="bank_noble1" onclick="nobleEditor.buttonClick(this.id);event.preventDefault();"></div></div>
        <div class="column"><div id="bank_noble2" onclick="nobleEditor.buttonClick(this.id);event.preventDefault();"></div></div>
        <div class="column"><div id="bank_noble3" onclick="nobleEditor.buttonClick(this.id);event.preventDefault();"></div></div>
      </div>

      <div class="ui hidden divider"></div>
      Change by any noble in the list:
      <div class="ui five column compact centered grid">
        <div class="column" id="avail_noble0" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble1" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble2" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble3" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble4" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>

        <div class="column" id="avail_noble5" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble6" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble7" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble8" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
        <div class="column" id="avail_noble9" onclick="nobleEditor.clickToEdit(this.id);event.preventDefault();"></div>
      </div>
      <div class="ui fluid large wrapped wrapping buttons">
        <button class="ui basic button" id="noble_assign_P-1" onclick="nobleEditor.clickToEdit(this.id)">Not won</button>
        <button class="ui basic button" id="noble_assign_P0"  onclick="nobleEditor.clickToEdit(this.id)">Won by P0</button>
        <button class="ui basic button" id="noble_assign_P1"  onclick="nobleEditor.clickToEdit(this.id)">Won by P1</button>
        <button class="ui basic button" id="noble_assign_P2"  onclick="nobleEditor.clickToEdit(this.id)">Won by P2</button>
      </div>
    </div>

    <div id="gem_editor" style="display: none">
      <div class="ui fluid large buttons">
        <button class="ui basic button" id="editor_P-1" onclick="gemEditor.buttonClick(this.id)">Bank</button>
        <button class="ui basic button" id="editor_P0" onclick="gemEditor.buttonClick(this.id)">Player0</button>
        <button class="ui basic button" id="editor_P1" onclick="gemEditor.buttonClick(this.id)">Player1</button>
        <button class="ui basic button" id="editor_P2" onclick="gemEditor.buttonClick(this.id)">Player2</button>
      </div>

      <div class="ui hidden divider"></div>
      <div class="ui equal width compact center aligned grid">
        <div class="column">
          <button class="ui basic large button" id="editor_g0_plus" onclick="gemEditor.clickToEdit(this.id)">+</button>
          <div id="editor_g0"></div>
          <button class="ui basic large button" id="editor_g0_minus" onclick="gemEditor.clickToEdit(this.id)">-</button>
        </div>
        <div class="column">
          <button class="ui basic large button" id="editor_g1_plus" onclick="gemEditor.clickToEdit(this.id)">+</button>
          <div id="editor_g1"></div>
          <button class="ui basic large button" id="editor_g1_minus" onclick="gemEditor.clickToEdit(this.id)">-</button>
        </div>
        <div class="column">
          <button class="ui basic large button" id="editor_g2_plus" onclick="gemEditor.clickToEdit(this.id)">+</button>
          <div id="editor_g2"></div>
          <button class="ui basic large button" id="editor_g2_minus" onclick="gemEditor.clickToEdit(this.id)">-</button>
        </div>
        <div class="column">
          <button class="ui basic large button" id="editor_g3_plus" onclick="gemEditor.clickToEdit(this.id)">+</button>
          <div id="editor_g3"></div>
          <button class="ui basic large button" id="editor_g3_minus" onclick="gemEditor.clickToEdit(this.id)">-</button>
        </div>
